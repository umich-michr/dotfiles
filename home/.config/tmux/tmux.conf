##### ------------------------------------------------------------
#####  TMUX CORE SETTINGS
##### ------------------------------------------------------------

# Increase scrollback history (Default is only 2000)
set -g history-limit 100000

# Enable mouse support (Clicking panes, dragging to resize, and scrolling)
set -g mouse on

# Integrate with the system clipboard directly when supported (works well on macOS, sometimes flaky on Linux depending on terminal + compositor)
set-option -g set-clipboard on
# Stop tmux from automatically naming the window based on commands
set-option -g allow-set-title off

##### ------------------------------------------------------------
#####  STATUS BAR
##### ------------------------------------------------------------

# Transparent status bar background
set -g status-style bg=default

# Right side status content
set -g status-left-length 100
set -g status-right-length 100
set -g status-right "#[fg=magenta]Pane:#P #{=15:pane_title}  #[default]#(whoami)@#H"

# Refresh interval (to keep the path updated as you move)
set -g status-interval 2
##### ------------------------------------------------------------
#####  PANE APPEARANCE / BORDERS
##### ------------------------------------------------------------

# Show pane titles at top
set -g pane-border-status top

# Format for pane title display
set -g pane-border-format "#{?pane_active, ▶ #P #{=18:pane_title} #[fg=colour244],#[fg=colour244] #P #{=18:pane_title} }"

# Inactive pane styling (subtle)
set -g pane-border-style "fg=colour240"

# Active pane styling (highlighted)
set -g pane-active-border-style "fg=magenta,bold,bg=default"

##### ------------------------------------------------------------
#####  KEY BINDINGS
##### ------------------------------------------------------------

# Reload config file with Prefix + r
#bind r source-file ~/.tmux.conf \; display "Config Reloaded!"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"
# Rename pane interactively
bind-key T command-prompt -p "Rename pane:" "select-pane -T '%%'"
bind-key -n C-k send-keys -R \; send-keys C-l \; clear-history

##### ------------------------------------------------------------
#####  COPY MODE / CLIPBOARD INTEGRATION
##### ------------------------------------------------------------

# --- Cross-platform Clipboard (macOS / Wayland / X11) ---

if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
  "if-shell 'command -v wl-copy >/dev/null 2>&1' \
      'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel \"wl-copy\"' \
      'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel \"xclip -in -selection clipboard\"'"

##### ------------------------------------------------------------
#####  NOTES
##### ------------------------------------------------------------
# Copy requires:
# - macOS: pbcopy (built-in)
# - Linux: xclip installed
